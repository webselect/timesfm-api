[project]
name = "timesfm-api"
version = "0.1.0"
description = "Service REST exposant TimesFM 3.0 (Google Research) pour la prevision de series temporelles."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
]
dependencies = [
  "timesfm[torch]>=3.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-m 'not model' -q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "model: test d'integration qui charge reellement les poids TimesFM (lent, ~1.2 Go)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
